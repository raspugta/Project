[project]
name = "baymax-os"
version = "0.1.0"
description = "Local multimodal personal health & care assistant with a deterministic safety core"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "websockets>=12", "pydantic>=2.6", "httpx>=0.27"]

[project.optional-dependencies]
stt = ["faster-whisper>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
baymax = "baymax.server.app:main"
baymax-eval = "baymax.eval.__main__:main"

[tool.setuptools.packages.find]
include = ["baymax*"]

[tool.setuptools.package-data]
baymax = ["knowledge/data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
